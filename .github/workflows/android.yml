# Builds the Android app (APK) and posts it as a GitHub Release.
# Download link that always points at the newest build:
#   https://github.com/dylancleverdon/CafeJobFinder3000/releases/latest/download/CafeJobFinder.apk
#
# App changes (screens, logic) don't need a new APK: the installed app updates
# itself from app/ on main. A new APK is only built when the Android shell
# changes, or when started by hand (Actions → Android APK → Run workflow).
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the app
        run: npm run build

      - name: Copy it into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk CafeJobFinder.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Cafe Jobs for Android (build ${{ github.run_number }})
          make_latest: "true"
          files: CafeJobFinder.apk
          body: |
            **Install:** open this page on your Android phone and tap **CafeJobFinder.apk**, then **Install**.
            The first time, Android asks you to allow installs from your browser. Say yes.

            After that, the app updates itself. There's no need to download it again.
